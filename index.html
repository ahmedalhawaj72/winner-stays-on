public/index.html<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1v1 penalty shootout. Winner stays on, loser joins the queue.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Winner Stays On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: dusk sky over a curved horizon. Timer up top, the goal on the hill, picks, score strip and tab bar below. */
:root{
  color-scheme:dark;
  --night:#0b0a3c; --deep:#0e0d4a; --panel:#17165c; --line:#2c2a78;
  --mint:#b4fbf3; --lilac:#d7b4f3; --rose:#f7a6c4; --ice:#ffffff; --dim:#aeb0dc;
  --ui:"Montserrat","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ice);font:500 15px/1.3 var(--ui);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

.corner{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.corner.l{left:max(16px,env(safe-area-inset-left,0px))}
.corner.r{right:max(16px,env(safe-area-inset-right,0px))}
.ghost{width:40px;height:40px;border:0;border-radius:12px;background:rgba(14,13,74,.55);display:grid;place-items:center;cursor:pointer;padding:0}
.ghost svg,.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ghost.off{color:var(--rose)}
#exitBtn{width:auto;padding:0 13px;font-weight:700;font-size:13px}

#prompt{position:fixed;left:0;right:0;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));display:grid;justify-items:center;gap:2px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#track{width:100%;max-width:358px;box-sizing:border-box;background:rgba(14,13,74,.82);border-radius:10px;padding:7px 10px;display:grid;gap:5px;margin-top:14px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;gap:8px;align-items:center;text-align:left}
.pname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname.shooting{color:var(--mint)}
.marks{display:flex;gap:5px}
.mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;color:var(--night)}
.mark.g{background:var(--mint);border-color:var(--mint)}
.mark.m{background:var(--rose);border-color:var(--rose)}
.mark.now{border-color:var(--ice);box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.tsum{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
#round{background:var(--rose);color:var(--night);border-radius:999px;padding:4px 13px;font-size:12px;font-weight:700;white-space:nowrap}
#big{min-height:1.05em;font-size:clamp(40px,9vh,64px);line-height:1.05;font-weight:700;color:var(--ice);font-variant-numeric:tabular-nums}
#big.hot{color:var(--rose)}
#head{min-height:1.25em;font-size:clamp(17px,4.6vw,23px);font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
#read{font-size:14px;color:var(--mint);font-weight:600;min-height:18px;overflow-wrap:anywhere}

.zone{position:fixed;z-index:2;background:transparent;border:0;padding:0;pointer-events:none;border-radius:6px;color:transparent;font-weight:800;font-size:clamp(11px,3vw,15px)}
.zone.live{pointer-events:auto;cursor:pointer;background:rgba(180,251,243,.12);outline:1.5px solid rgba(180,251,243,.75);outline-offset:-3px;animation:breathe 1s ease-in-out infinite;color:#fff}
@keyframes breathe{50%{background:rgba(180,251,243,.3)}}
.zone.live:hover{background:rgba(180,251,243,.14)}
.zone.sel{background:rgba(255,255,255,.5)!important;outline-color:#fff;color:var(--night);animation:none}
#banner{position:fixed;left:0;right:0;z-index:4;text-align:center;pointer-events:none;display:grid;gap:4px;padding:0 16px;opacity:0;transform:scale(1.5);transition:opacity .14s,transform .22s cubic-bezier(.2,1.5,.4,1)}
#banner b{font:800 clamp(44px,13vw,84px)/1 var(--ui);letter-spacing:-.01em;text-transform:uppercase}
#banner span{font:800 clamp(18px,5vw,28px)/1.15 var(--ui)}
#banner.on{opacity:1;transform:scale(1)}
#banner.won{color:var(--mint);text-shadow:0 4px 22px rgba(11,10,60,.85)}
#banner.lost{color:var(--rose);text-shadow:0 4px 22px rgba(11,10,60,.85)}
#banner.neutral{color:#fff;text-shadow:0 4px 22px rgba(11,10,60,.85)}
#round.hot{background:var(--mint);animation:breathe2 .7s ease-in-out infinite}
@keyframes breathe2{50%{transform:scale(1.1)}}

.dock{position:fixed;inset:auto 0 0;z-index:3;background:var(--night);padding-bottom:env(safe-area-inset-bottom,0px)}
.dockin{width:100%;max-width:560px;margin:0 auto;display:grid;gap:9px;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:60px}
.tab{background:none;border:0;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.tab.on{color:var(--ice)}
.tab.new::after{content:"";position:absolute;top:13px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--rose)}

#sheet{position:fixed;z-index:6;left:0;right:0;bottom:calc(69px + env(safe-area-inset-bottom,0px));pointer-events:none;display:grid;justify-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheetin{pointer-events:auto;width:100%;max-width:528px;height:min(340px,52vh);background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
.sheethead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
#chatClose{background:none;border:0;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;color:var(--dim)}
.panel{min-height:0;display:grid}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;display:grid;align-content:start;gap:7px}
.list li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:15px}
.n{color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.who.me{color:var(--mint)}
.v{font-weight:800;color:var(--lilac);font-variant-numeric:tabular-nums}
.none{color:var(--dim);display:block!important}
#chat{grid-template-rows:minmax(0,1fr) auto;gap:8px}
#chatLog{overflow-y:auto;min-height:0;list-style:none;margin:0;padding:0;display:grid;align-content:start;gap:6px;user-select:text;-webkit-user-select:text}
#chatLog li{overflow-wrap:anywhere}
#chatLog b{color:var(--lilac);margin-right:6px}
#chatLog b.me{color:var(--mint)}
#chatForm{display:flex;gap:6px}
#chatForm input{flex:1;min-width:0;min-height:44px}
#chatForm .btn{min-height:44px;padding:6px 14px}

#toast{position:fixed;z-index:30;left:50%;bottom:calc(214px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(370px,calc(100vw - 32px));background:var(--panel);border-radius:10px;padding:9px 12px;text-align:center;font-size:14px;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}

#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(11,10,60,.62);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.gatecard{width:min(380px,100%);background:var(--deep);border-radius:18px;padding:22px;display:grid;gap:11px}
.gatecard h1{margin:0;font-size:clamp(30px,8vw,38px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
#roomLine{margin:0;color:var(--dim);font-size:14px}
label{display:grid;gap:5px;font-size:12px;color:var(--dim)}
input[type=text]{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font:600 16px var(--ui);color:var(--ice);user-select:text;-webkit-user-select:text}
.btn{min-height:48px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:8px 12px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--mint)}
.btn.main{background:var(--mint);border-color:var(--mint);color:var(--night)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{margin:0;color:var(--rose);font-size:14px}
@media(max-height:520px){
  #round{display:none}#big{font-size:24px}#head{font-size:14px}#read{display:none}#prompt{padding-left:150px;padding-right:64px}
  
  #track{padding:3px 8px;gap:2px;margin-top:0}.mark{width:15px;height:15px;font-size:9px}.pname{font-size:12px}.tsum{font-size:13px}
  .tabs{height:46px}
  #sheet{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){#banner{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div class="corner l">
  <button class="ghost" id="soundBtn" aria-label="Turn sound off" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></button>
  <button class="ghost" id="exitBtn" hidden>Menu</button>
</div>
<div class="corner r">
  <button class="ghost" id="fsBtn" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</div>

<div id="prompt" aria-live="polite">
  <span id="round">Best of 5</span>
  <div id="track" aria-label="Penalty score">
    <div class="trow"><span class="pname" id="nameA">Waiting</span><span class="marks" id="marksA"></span><span class="tsum" id="scoreA">0</span></div>
    <div class="trow"><span class="pname" id="nameB">Waiting</span><span class="marks" id="marksB"></span><span class="tsum" id="scoreB">0</span></div>
  </div>
  <div id="big"></div>
  <div id="head">Two players start the match</div>
  <div id="read"></div>
</div>

<button class="zone" data-c="0" aria-label="Left" tabindex="-1">Left</button>
<button class="zone" data-c="1" aria-label="Middle" tabindex="-1">Middle</button>
<button class="zone" data-c="2" aria-label="Right" tabindex="-1">Right</button>
<div id="banner" aria-live="assertive"></div>

<footer class="dock" id="dock">
  <div class="dockin">
    <nav class="tabs" aria-label="Game menu">
      <button class="tab" data-tab="rank" aria-label="Ranking"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg></button>
      <button class="tab" id="chatBtn" data-tab="chat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg></button>
      <button class="tab on" data-tab="" aria-label="Game"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg></button>
      <button class="tab" data-tab="queue" aria-label="Queue"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button class="tab" id="inviteBtn" aria-label="Copy invite link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg></button>
    </nav>
  </div>
</footer>

<div id="sheet" hidden>
  <div class="sheetin">
    <div class="sheethead"><span id="sheetTitle">Queue</span><button id="chatClose" aria-label="Close">×</button></div>
    <section class="panel" id="queuePanel" hidden><ul class="list" id="queue"></ul></section>
    <section class="panel" id="rankPanel" hidden><ul class="list" id="rank"></ul></section>
    <section class="panel" id="chat" aria-label="Chat" hidden>
      <ul id="chatLog" aria-live="polite"></ul>
      <form id="chatForm"><input type="text" id="chatInput" maxlength="100" autocomplete="off" aria-label="Message"><button class="btn main" type="submit">Send</button></form>
    </section>
  </div>
</div>
<div id="toast" hidden></div>

<div id="gate">
  <form class="gatecard" id="joinForm">
    <h1>Winner Stays On</h1>
    <p id="roomLine">Connecting to the room…</p>
    <label for="nameInput">Your name
      <input type="text" id="nameInput" maxlength="18" autocomplete="nickname">
    </label>
    <p class="err" id="joinErr" hidden></p>
    <button class="btn main" id="joinBtn" type="submit" disabled>Enter the queue</button>
    <button class="btn" id="practiceBtn" type="button">Practice against the bot</button>
    <button class="btn" id="gateInvite" type="button">Copy invite link</button>
  </form>
</div>

<script src="engine.js"></script>
<script>
const INVITE = location.origin + '/';
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const CORNER = ['left', 'middle', 'right'];
const WIND = 1.8, FLIGHT = .9, CAM = 19, SPOT = CAM / (CAM - 11);
const PHASES = ['idle', 'intro', 'pick', 'reveal', 'kick', 'over'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = (list, seed) => list[Math.abs(seed) % list.length];


let room = null, roomState = 'connecting', db = null, canWrite = true, dbWins = {}, me = null, solo = false, joined = false, wasHost = false;
let S = E.fresh(), P = {}, peers = [], recv = 0, animated = 0, written = {};
let commits = {}, myPick = null, verified = {}, absent = {}, botP = {}, tend = { shot: [1, 1, 1], dive: [1, 1, 1] };
let wakeLock = null, heartbeat = 0, lastBeat = 0, myName = '', soundOn = true;

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const cleanName = n => String(n || '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 18);
function pub(patch) {
  for (const [k, v] of Object.entries(patch)) { if (v === null) delete P[k]; else P[k] = v; }
  if (!solo && room) room.presence(patch).catch(() => {});
}
const presenceOf = p => solo ? (p === 'bot' ? botP : P) : ((peers.find(x => x.peer === p) || {}).presence || null);

/* ---------- Sound ---------- */
let ac = null;
function unlockAudio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
}
function tone(type, f1, f2, t0, dur, vol) {
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(t0, dur, freq, vol) {
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + t0;
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .7;
  g.gain.setValueAtTime(.0008, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .25); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
const sfx = {
  beat() { tone('sine', 62, 44, 0, .18, .5); },
  goal() { tone('sine', 660, 660, 0, .11, .22); tone('sine', 990, 990, .1, .22, .22); },
  save() { tone('triangle', 180, 90, 0, .16, .4); },
};
const play = n => { if (soundOn && ac) try { sfx[n](); } catch {} };
/* ---------- Network ---------- */
function roster() {
  if (solo) return [{ peer: 'me', name: myName, since: 1 }, { peer: 'bot', name: 'Keeper Bot', since: 2 }];
  return peers.filter(p => p.kind === 'viewer' && p.presence && p.presence.v === 2 && cleanName(p.presence.name)).map(p => ({
    peer: p.peer, name: cleanName(p.presence.name), since: Number(p.presence.since) || 0, ready: !!p.presence.ready,
    fresh: p.isMe && p.sameTab ? !document.hidden : Date.now() - p.updatedAt < 8000,
  }));
}
function electHost(list) {
  return list.filter(r => r.ready && r.fresh).sort((a, b) => a.since - b.since || (a.peer < b.peer ? -1 : 1))[0]?.peer || null;
}
function validState(s) {
  return s && typeof s === 'object' && Number.isInteger(s.ver) && PHASES.includes(s.phase) && Array.isArray(s.q) && Array.isArray(s.ka) && Array.isArray(s.kb) && s.w && typeof s.w === 'object';
}
function adopt() {
  for (const p of peers) {
    const st = p.presence && p.presence.st;
    if (validState(st) && (st.ver > S.ver || (st.ver === S.ver && String(st.by) > String(S.by)))) { S = clone(st); onState(); }
  }
}
const isGone = p => !solo && absent[p] !== undefined && Date.now() - absent[p] > 6000;
function trackAbsent(list) {
  const here = new Set(list.map(r => r.peer));
  for (const p of [S.a, S.b, ...S.q]) {
    if (!p) continue;
    if (here.has(p)) delete absent[p]; else if (absent[p] === undefined) absent[p] = Date.now();
  }
}
async function sha(text) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(d)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
}
function verify(peer, act) {
  if (solo) return true;
  if (act.pick === undefined) return undefined;
  const key = [peer, act.id, act.h, act.pick, act.salt].join('|');
  if (key in verified) return verified[key];
  verified[key] = undefined;
  if (![0, 1, 2].includes(act.pick)) { verified[key] = false; return false; }
  sha(act.id + '|' + act.pick + '|' + act.salt).then(h => { verified[key] = h === act.h; tick(); });
  return undefined;
}
function botBrain() {
  if (S.phase !== 'pick' || (botP.act && botP.act.id === S.id) || Date.now() - recv < 900) return;
  const botRole = S.a === 'bot' ? 'a' : 'b';
  let c = Math.floor(Math.random() * 3);
  if (Math.random() < .6) {
    const list = S.sh === botRole ? tend.dive : tend.shot;
    c = list.indexOf(S.sh === botRole ? Math.min(...list) : Math.max(...list));
  }
  botP.act = { id: S.id, h: 'bot', pick: c, salt: '' };
}
function tick() {
  const now = Date.now();
  if (room && !solo) peers = room.peers();
  if (!me && room) { const mine = peers.find(p => p.sameTab); if (mine) me = mine.peer; }
  if (!solo) { adopt(); readChat(); }
  const list = roster();
  trackAbsent(list);
  if (joined && !solo && now - lastBeat > 2500) { lastBeat = now; pub({ hb: ++heartbeat % 1000 }); }
  const host = joined && solo;
  if (host) {
    if (!wasHost) { wasHost = true; S.end = now + S.dur; }
    if (solo) botBrain();
    const changed = E.step(S, { roster: list, now, gone: isGone, act: p => (presenceOf(p) || {}).act || null, verify, rand: n => Math.floor(Math.random() * n) });
    if (changed) { S.ver += 1; S.by = me; onState(); }
    if (!solo && (!P.st || P.st.ver !== S.ver)) pub({ st: clone(S) });
  } else if (wasHost) { wasHost = false; if (!solo) pub({ st: null }); }
  const role = roleOf(me);
  if (role && S.phase === 'reveal' && !solo) {
    const h = S['h' + role], c = h && commits[h];
    if (c && P.act && (P.act.h !== h || P.act.pick === undefined)) pub({ act: { id: S.id, h, pick: c.pick, salt: c.salt } });
  }
  render(list);
}
const roleOf = p => !p ? null : S.a === p ? 'a' : S.b === p ? 'b' : null;
function saveWin() {
  if (solo || !db || !canWrite || !S.mid || written[S.mid]) return;
  written[S.mid] = true;
  const name = S.win === 'a' ? S.na : S.nb;
  db.doc('wins/' + S.mid).set({ name, at: Date.now() }).catch(() => { canWrite = false; });
}
function onState() {
  const newPhase = S.phase !== onState.phase;
  if (newPhase || S.id !== onState.id) recv = Date.now();
  if (S.id !== onState.id) myPick = null;
  onState.phase = S.phase; onState.id = S.id;
  if (S.phase === 'kick' && S.last && animated !== S.last.id) playKick(S.last);
  if (S.phase === 'over') {

function pathTo(sx, sy, tx, ty, bend) { return [(sx + tx) / 2 + bend * G.w * .32, Math.min(sy, ty) + (sy - ty) * .2]; }

function burst(goal, c) {
  const [x, y] = corner(c), n = reduced ? 0 : goal ? 70 : 34;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.3, v = 1.5 + Math.random() * 8;

function frame(now) {
  requestAnimationFrame(frame);

  shake = Math.max(0, shake - .4);

  netHit *= .96;

  const sx = W / 2, sy = G.spotY;

}

/* ---------- Chat ---------- */
const seenChat = new Set(); let chatOut = [], chatSeq = 0;
function addMsg(name, text, mine) {
  const log = $('chatLog'), li = document.createElement('li'), b = document.createElement('b');
  b.textContent = name; if (mine) b.className = 'me';
  li.append(b, document.createTextNode(text)); log.append(li);
  while (log.children.length > 60) log.firstChild.remove();
  log.scrollTop = log.scrollHeight;
  if ($('chat').hidden && !mine) { toast(`${name}: ${text}`); $('chatBtn').classList.add('new'); }
}
function readChat() {
  for (const p of peers) {
    const list = p.presence && p.presence.chat, name = p.presence && cleanName(p.presence.name);
    if (!Array.isArray(list) || !name) continue;
    for (const m of list) {
      if (!m || !Number.isInteger(m.i) || typeof m.x !== 'string') continue;
      const key = p.peer + ':' + m.i;
      if (seenChat.has(key)) continue;
      seenChat.add(key);
      addMsg(name, m.x.slice(0, 100), p.peer === me);
    }
  }
}
const TABS = { rank: ['rankPanel', 'Ranking'], chat: ['chat', 'Chat'], queue: ['queuePanel', 'Queue'] };
function openTab(name) {
  $('sheet').hidden = !name;
  for (const [k, [id, title]] of Object.entries(TABS)) { $(id).hidden = k !== name; if (k === name) $('sheetTitle').textContent = title; }
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.toggle('on', t.dataset.tab === (name || '')));
  if (name === 'chat') { $('chatBtn').classList.remove('new'); $('chatLog').scrollTop = 1e6; $('chatInput').focus(); }
}
const toggleChat = open => openTab(open ? 'chat' : '');
document.querySelectorAll('.tab[data-tab]').forEach(t => t.addEventListener('click', () => {
  const k = t.dataset.tab, open = !$('sheet').hidden && k && !$(TABS[k][0]).hidden;
  openTab(open ? '' : k);
}));
$('chatClose').addEventListener('click', () => openTab(''));
$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const x = $('chatInput').value.replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, 100);
  if (!x || !joined || solo) return;
  chatOut = [...chatOut.slice(-2), { i: ++chatSeq, x }];
  pub({ chat: chatOut });
  $('chatInput').value = ''; tick();
});

/* ---------- Controls ---------- */
function toast(text) {
  const t = $('toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3800);
}
async function copyInvite() {
  try { await navigator.clipboard.writeText(INVITE); toast('Invite link copied'); }
  catch { toast(INVITE); }
}
function goFull() { try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {} }
async function keepAwake() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
function joinRoom(name) {
  myName = name; store.set('wso-name', name);
  joined = true; $('gate').hidden = true; $('exitBtn').hidden = false;
  pub({ v: 2, name, since: Date.now(), hb: 0 });
  setTimeout(() => { pub({ ready: true }); tick(); }, 1500);
  keepAwake(); tick();
}
function startPractice(name) {
  myName = name || 'You';
  solo = true; joined = true; me = 'me'; wasHost = false; S = E.fresh(); P = {}; botP = {}; onState.phase = ''; onState.id = 0; animated = 0; recv = Date.now();
  $('gate').hidden = true; $('exitBtn').hidden = false; $('chatBtn').hidden = true; toggleChat(false); tick();
}
function leavePractice() {
  solo = false; joined = false; wasHost = false; S = E.fresh(); P = {}; botP = {}; me = null; myPick = null; anim = null;
  $('banner').className = ''; $('gate').hidden = false; $('exitBtn').hidden = true; $('chatBtn').hidden = false;

document.querySelectorAll('.zone').forEach((z, i) => z.addEventListener('click', () => pickCorner(i)));
$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const n = cleanName($('nameInput').value);

let armExit = false;

  myPick = null; tick();
}

$('fsBtn').hidden = !document.fullscreenEnabled;

document.addEventListener('visibilitychange', () => { if (!document.hidden && joined && !wakeLock) keepAwake(); });
addEventListener('resize', layout);

$('nameInput').value = store.get('wso-name');

onState.phase = ''; onState.id = 0;
layout(); render(roster());
requestAnimationFrame(frame);
setInterval(tick, 250);
/* Connection to the game server. It offers the same room calls the game already uses. */
(() => {
  const token = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
  let ws = null, retry = 500, list = [], mine = {}, myPeer = null, live = false, listeners = [];
  const snapshot = () => { peers = list; tick(); };
  const stamp = (p, presence, kind) => ({ peer: p, isMe: p === myPeer, sameTab: p === myPeer, kind, presence, updatedAt: Date.now() });
  function connect() {
    ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws?token=' + token);
    ws.onopen = () => { retry = 500; if (Object.keys(mine).length) ws.send(JSON.stringify({ t: 'p', presence: mine })); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'welcome') {
        myPeer = m.peer; me = m.peer;
        list = m.peers.map(x => stamp(x.peer, x.presence, 'viewer'));
        if (!list.some(x => x.peer === myPeer)) list.push(stamp(myPeer, mine, 'viewer'));
        list.push(stamp('server', { st: m.st }, 'server'));

      } else if (m.t === 'p') {

        list = list.filter(x => x.peer !== m.peer); snapshot();

      }

  }
  room = {
    presence: async patch => {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete mine[k]; else mine[k] = v; }
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'p', presence: mine }));
    },
    peers: () => list,
  };
  connect();
})();
